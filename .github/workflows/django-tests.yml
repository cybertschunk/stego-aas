name: Django Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Cache HuggingFace models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-huggingface-gpt2

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django system check
      working-directory: ./stego-aas/stegoaas
      run: |
        python manage.py check

    - name: Run Django migrations
      working-directory: ./stego-aas/stegoaas
      run: |
        python manage.py migrate --noinput

    - name: Download GPT-2 model (with retries)
      run: |
        python -c "from transformers import AutoModelForCausalLM, AutoTokenizer; AutoModelForCausalLM.from_pretrained('openai-community/gpt2'); AutoTokenizer.from_pretrained('openai-community/gpt2')"
      timeout-minutes: 10

    - name: Run tests
      working-directory: ./stego-aas/stegoaas
      run: |
        python manage.py test sparsamp_app.tests
      timeout-minutes: 10

    - name: Run test coverage
      working-directory: ./stego-aas/stegoaas
      run: |
        pip install coverage
        coverage run --source='sparsamp_app' manage.py test sparsamp_app.tests
        coverage report
        coverage xml

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./stego-aas/stegoaas/coverage.xml
