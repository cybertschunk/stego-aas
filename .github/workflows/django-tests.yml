name: Django Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django system check
      working-directory: ./stego-aas/stegoaas
      run: |
        python manage.py check

    - name: Run Django migrations
      working-directory: ./stego-aas/stegoaas
      run: |
        python manage.py migrate --noinput

    - name: Run tests
      working-directory: ./stego-aas/stegoaas
      run: |
        python manage.py test sparsamp_app.tests.test_sparsamp

    - name: Run test coverage (Python 3.10 only)
      if: matrix.python-version == '3.10'
      working-directory: ./stego-aas/stegoaas
      run: |
        pip install coverage
        coverage run --source='sparsamp_app' manage.py test sparsamp_app.tests.test_sparsamp
        coverage report
        coverage xml

    - name: Upload coverage to artifacts
      if: matrix.python-version == '3.10'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ./stego-aas/stegoaas/coverage.xml
